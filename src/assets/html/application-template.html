<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <!-- Theme -->
    <link rel="stylesheet" type="text/css" href="../themes/default.css"/>
  </head>
  <body>
    <tab-group sortable="true">
      <style>
@import url(../themes/media.css);

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track, /* Track */
::-webkit-scrollbar-thumb:window-inactive, /* Handle */
::-webkit-scrollbar-corner { /* Corner */
  background-color: transparent;
}

/* Handle */
::-webkit-scrollbar-thumb {
  background-color: var(--scrollbar-thumb-color);
}

.etabs::before {
  z-index: 1000;
  content: "";
  position: relative;
  display: block;
  height: 1px;
  width: 100%;
  box-shadow: var(--tabs-shadow);
}

.etabs .buttons {
  border-color: var(--border-color);
}

.etabs .buttons:hover button {
  background: none;
}

.etabs .nav {
  height: var(--window-tabs-height);
  background: var(--background-color);
  box-shadow: none;
  border: none;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
}

.etabs .tab {
  background: var(--window-tabs-background-color);
  border: 1px solid var(--border-color) !important;
  padding: 4px 5px !important;
  color: var(--window-tabs-text-color);
  font-family: var(--sans-serif);
  box-shadow: none;
  transition: border 200ms, background-color 200ms, color 200ms;
}

.etabs .tab:first-child {
  border-left: 0;
}

.etabs .tab:focus {
  border: 1px solid var(--system-blue) !important;
}

.etabs .tab.active {
  z-index: 1100;
  background: var(--background-color);
  color: var(--window-tabs-highlight-color);
}

.etabs .tab-icon {
  width: 16px;
  height: 16px;
  transform: scale(1.4);
}

.etabs .tab-title {
  margin-left: 5px;
}

.etabs .tab-audio,
.etabs .tab-pin,
.etabs .tab-close {
  position: relative;
  appearance: none;
  border: none;
  border-radius: 4px;
  background: none;
  color: var(--window-tabs-text-color);
  font-size: 18px;
  top: 0px;
}

@media (prefers-color-scheme: light) {
  .etabs .tab-audio:hover,
  .etabs .tab-pin:hover,
  .etabs .tab-close:hover {
    background-color: var(--system-gray4);
  }
}

.etabs .tab-audio:hover,
.etabs .tab-close:hover {
  color: var(--system-gray0);
}

.etabs .tab-pin,
.etabs .tab-audio {
  display: none;
}

.etabs .tab:not(.active) .tab-audio {
  display: none !important;
}

.etabs .tab-close {
  visibility: hidden;
}

.etabs .tab.active .tab-close,
.etabs .tab:hover .tab-close {
  visibility: visible;
}

.etabs .tab-audio {
  margin-right: -3px;
}

.etabs .tab-audio,
.etabs .tab-pin,
.etabs .tab-close {
  margin-left: 5px;
}

.etabs .tab-pin span {
  font-size: inherit;
  transform: rotate(45deg);
}
      </style>
    </tab-group>
  </body>
</html>
